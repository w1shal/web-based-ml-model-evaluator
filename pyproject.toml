
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-based-ml-model-evaluator"
version = "0.1.0"
description = "A web-based machine learning model evaluation platform"
requires-python = ">=3.10"

# ----------------------------------------------------------------- lint
[tool.ruff]
target-version = "py310"
line-length = 120
src = ["backend"]
extend-exclude = ["frontend", ".venv"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear, UP: pyupgrade,
# S: bandit security checks, C4: comprehensions, SIM: simplifications.
select = ["E", "W", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI's Depends()/Query() in argument defaults is the framework idiom
    "E731",  # small lambdas (e.g. the PDF escape helper) are intentional
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S107", "S311", "E501"]  # asserts, dummy secrets, long fixtures

[tool.ruff.lint.isort]
known-first-party = ["app", "backend"]
