events {}

http {
  include       /etc/nginx/mime.types;
  server_tokens off;

  # HTTP is only used to redirect to HTTPS (TC-SEC-004: HTTP redirected/refused)
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;          # TLS below 1.2 refused
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 11m;                     # 10 MB dataset limit + multipart overhead

    # Static frontend
    location / {
      root  /usr/share/nginx/html;
      index index.html auth.html;
      try_files $uri $uri/ =404;
    }

    # API routes proxied to the backend container
    location ~ ^/(auth|datasets|evaluations|history|reports|docs|openapi\.json) {
      proxy_pass         http://api:8000;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      # Overwrite (do not append) so clients cannot spoof their IP and dodge rate limiting
      proxy_set_header   X-Forwarded-For   $remote_addr;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }
  }
}
