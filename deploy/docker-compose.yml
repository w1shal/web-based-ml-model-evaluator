# MLE-SEC-004: HTTPS in front of the API.
#   1. sh deploy/gen-dev-cert.sh          (self-signed cert for local/staging; use a real cert in production)
#   2. cp .env.example .env  and set JWT_SECRET
#   3. docker compose -f deploy/docker-compose.yml --env-file .env up --build
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    env_file: ../.env
    volumes:
      - api-data:/data
    expose:
      - "8000"          # internal only: not published to the host
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../frontend:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  api-data:
